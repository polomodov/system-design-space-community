name: sds-retry-storm-outbox

services:
  db:
    image: postgres:17.5-alpine3.21
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lab-network

  runner:
    image: postgres:17.5-alpine3.21
    environment:
      PGHOST: db
      PGDATABASE: lab
      PGUSER: lab
      PGPASSWORD: lab-local-only
    command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h db -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./starter:/workspace/starter:ro
      - ./solution:/workspace/solution:ro
    networks:
      - lab-network

networks:
  lab-network:
    name: sds-retry-storm-outbox-network

volumes:
  postgres-data:
    name: sds-retry-storm-outbox-data
