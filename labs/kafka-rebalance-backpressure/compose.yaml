name: sds-kafka-rebalance-backpressure

services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - lab-network

  consumer-a:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        exec /opt/kafka/bin/kafka-console-consumer.sh
        --bootstrap-server kafka:9092
        --topic lab-events
        --group sds-lab-consumers
        --consumer.config /etc/kafka/lab-consumer.properties
    volumes:
      - ./.state/consumer.properties:/etc/kafka/lab-consumer.properties:ro
    networks:
      - lab-network

  consumer-b:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        exec /opt/kafka/bin/kafka-console-consumer.sh
        --bootstrap-server kafka:9092
        --topic lab-events
        --group sds-lab-consumers
        --consumer.config /etc/kafka/lab-consumer.properties
    volumes:
      - ./.state/consumer.properties:/etc/kafka/lab-consumer.properties:ro
    networks:
      - lab-network

networks:
  lab-network:
    name: sds-kafka-rebalance-backpressure-network

volumes:
  kafka-data:
    name: sds-kafka-rebalance-backpressure-data
